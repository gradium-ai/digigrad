name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest tests/ -q
